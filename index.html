<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PILOKA - Optimasi Penjemputan Sampah</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(135deg, #1b5e20, #0d3b0f);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .landing {
        text-align: center;
        animation: fadeIn 0.8s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .logo {
        font-size: 5rem;
        font-weight: 800;
        color: white;
        letter-spacing: 0.1em;
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        margin-bottom: 40px;
      }

      .logo span {
        color: #a5d6a7;
      }

      .btn-mulai {
        display: inline-block;
        background: #ff9800;
        color: white;
        font-size: 1.5rem;
        font-weight: bold;
        padding: 14px 48px;
        border-radius: 50px;
        text-decoration: none;
        transition: all 0.3s;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        border: none;
        cursor: pointer;
      }

      .btn-mulai:hover {
        background: #e65100;
        transform: scale(1.05);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
      }

      .btn-mulai:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="landing">
      <div class="logo">PIL<span>O</span>KA</div>
      <a href="index.html" class="btn-mulai">MULAI</a>
    </div>
  </body>
</html>
